<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DesignHub Worker</title>
  <style>
    :root { color-scheme: light; font-family: Inter, Pretendard, system-ui, sans-serif; background: #f8f6f0; color: #201515; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 34px; background: radial-gradient(circle at 100% 0, #ffe9d9, transparent 36%), #f8f6f0; }
    main { max-width: 650px; margin: 0 auto; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: -.06em; }
    .mark { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 9px; background: #ff4f00; color: white; }
    .eyebrow { margin-top: 42px; color: #948b80; font-size: 11px; font-weight: 700; letter-spacing: .16em; }
    h1 { margin: 9px 0 12px; font-size: 34px; letter-spacing: -.07em; line-height: 1; }
    p { color: #847b71; font-size: 13px; line-height: 1.65; }
    .card { margin-top: 28px; padding: 22px; border: 1px solid #ded9cf; border-radius: 16px; background: #fffefb; box-shadow: 0 15px 50px rgba(32,21,21,.06); }
    .status { display: flex; align-items: center; gap: 10px; padding-bottom: 16px; border-bottom: 1px solid #eee9df; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #aaa39a; }
    .dot.online { background: #4e8c66; }
    .status strong { display: block; font-size: 14px; }
    .status small { display: block; margin-top: 4px; color: #948b80; font-size: 11px; }
    label { display: grid; gap: 8px; margin-top: 18px; color: #655d55; font-size: 11px; font-weight: 700; }
    input { width: 100%; height: 46px; padding: 0 13px; border: 1px solid #ded9cf; border-radius: 9px; background: #fff; color: #201515; font: 700 17px ui-monospace, monospace; letter-spacing: .08em; }
    input:focus { border-color: #ff4f00; outline: 3px solid rgba(255,79,0,.12); }
    button { min-height: 42px; padding: 0 15px; border: 0; border-radius: 8px; background: #201515; color: white; font-weight: 700; cursor: pointer; }
    button.secondary { background: #eee9df; color: #201515; }
    button:disabled { cursor: wait; opacity: .5; }
    .actions { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 18px; }
    .hint { padding: 12px; margin-top: 16px; border-radius: 9px; background: #fff4eb; color: #98602d; font-size: 11px; line-height: 1.55; }
    #message { min-height: 18px; margin: 12px 0 0; color: #98602d; font-size: 11px; }
    @media (max-width: 600px) { body { padding: 20px; } h1 { font-size: 29px; } }
  </style>
</head>
<body>
  <main>
    <div class="brand"><span class="mark">✦</span><span>DesignHub <small>FACTORY</small></span></div>
    <div class="eyebrow">LOCAL WORKER</div>
    <h1>내 컴퓨터에서<br /><em>자동으로 생성합니다.</em></h1>
    <p>홈페이지에서 예약한 작업을 받아 사용자 ChatGPT 계정으로 생성하고, 디자인허브 규격으로 정리해 업로드합니다.</p>
    <section class="card">
      <div class="status"><i class="dot" id="dot"></i><div><strong id="status">연결되지 않음</strong><small id="detail">홈페이지에서 연결 코드를 만든 뒤 입력하세요.</small></div></div>
      <div id="pairing">
        <label>홈페이지 연결 코드<input id="code" maxlength="9" autocomplete="off" placeholder="ABCD 2345" /></label>
        <div class="actions"><button id="pair">기기 연결</button><button class="secondary" id="openSite">홈페이지 열기</button></div>
        <div class="hint">ChatGPT 비밀번호나 API 키를 이 창에 입력하지 않습니다. 기기 연결 후 공식 Codex 로그인 흐름을 사용합니다.</div>
      </div>
      <div id="connected" hidden>
        <p id="connectedText"></p>
        <div class="actions"><button class="secondary" id="toggle">일시정지</button><button class="secondary" id="disconnect">기기 연결 해제</button></div>
      </div>
      <div id="message"></div>
    </section>
  </main>
  <script src="./renderer.js"></script>
</body>
</html>
